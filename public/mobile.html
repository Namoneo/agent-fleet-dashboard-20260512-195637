<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #09090b; color: white; padding: 16px; padding-bottom: 80px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-size: 20px; font-weight: bold; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: #18181b; border-radius: 16px; padding: 16px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: #818cf8; }
    .stat-label { font-size: 11px; color: #a1a1aa; margin-top: 4px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    .project { background: #18181b; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .project-icon { font-size: 32px; }
    .project-name { font-weight: 600; }
    .project-desc { font-size: 12px; color: #a1a1aa; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(24,24,27,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #27272a; }
    .nav-item { text-align: center; color: #a1a1aa; text-decoration: none; font-size: 11px; }
    .nav-item.active { color: #818cf8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🚀 Fleet</div>
    <div>🔔</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value">33</div>
      <div class="stat-label">Projects</div>
    </div>
    <div class="stat">
      <div class="stat-value">6</div>
      <div class="stat-label">Tasks</div>
    </div>
    <div class="stat">
      <div class="stat-value">4</div>
      <div class="stat-label">Agents</div>
    </div>
  </div>

  <div class="section-title">Recent Projects</div>

  <div class="project">
    <div class="project-icon">🛒</div>
    <div>
      <div class="project-name">Deal-hunter</div>
      <div class="project-desc">Dutch grocery deal scraper</div>
    </div>
  </div>

  <div class="project">
    <div class="project-icon">📝</div>
    <div>
      <div class="project-name">User Story Generator</div>
      <div class="project-desc">AI-powered story creation</div>
    </div>
  </div>

  <div class="project">
    <div class="project-icon">🤖</div>
    <div>
      <div class="project-name">LocalSiteAI</div>
      <div class="project-desc">Local AI site builder</div>
    </div>
  </div>

  <div class="project">
    <div class="project-icon">📊</div>
    <div>
      <div class="project-name">Melanium</div>
      <div class="project-desc">Project management tool</div>
    </div>
  </div>

  <nav class="nav">
    <a href="#" class="nav-item active">🏠 Home</a>
    <a href="#" class="nav-item">📁 Projects</a>
    <a href="#" class="nav-item">🤖 Agents</a>
    <a href="#" class="nav-item">✅ Tasks</a>
  </nav>
</body>
</html>
